# 术语表分类参考
#
# ⚠️ 已被命中数驱动方案取代（2026-10-04）
#   加载集判定改用 python scripts/glossary_load_plan.py <字幕.srt>：
#   常驻集无条件加载 + 用字幕扫全量表按「命中不同词形数 ≥ 阈值」列候选 → 用户门禁。
#   本文件的 keywords **不再驱动加载**（实测只有 69% 视频有 keywords 命中）。
#   keywords 保留作人工参考；新词可继续追加，但不会再影响加载集。
#
# 维护方式：Agent 协助维护（不可删除/改结构，只能追加 keywords）
# 用户也可手动编辑此文件
#
# 用法：
#   - .cache/glossary/<category>.csv — 上游术语缓存
#   - knowledge/01_terminology/<category>.csv — 项目术语库（如有同名文件）

categories:
  mechanical:
    label: "红石元件、信号、更新机制"
    keywords: [piston extender, DPE, TPE, 0-tick, observer, comparator, quasi connectivity, scheduled tick, repeater, diode, torch stub, fadeout clock, state update, leafstone, wallstone]
  slimestone:
    label: "绿萌、飞行器、粘液块技术"
    keywords: [flying machine, piston, slime block, sticky piston]
  tree_farm:
    label: "树场相关"
    keywords: [tree farm, sapling, bone meal, dark oak, spruce, QC detection]
  mob_farm:
    label: "刷怪塔、生物农场"
    keywords: [wither, ghast, end crystal, wither skeleton, mob farm, spawner, spawning rate]
  storage:
    label: "存储技术、物品分类"
    keywords: [sorter, sorting, storage, hopper, shulker, partition, unstackable, filter, main storage, bulk storage, shulker box, unloader, dropper, dispenser, blocker, hopper speed, box loader, container measurement, container fill level]
  computational:
    label: "红石计算"
    keywords: [logic gate, counter, encoder, decoder, memory cell, power level, subtract mode]
  contraptions:
    label: "实用装置"
    keywords: [chunk loader, breeder, duper, farm, cobblestone farm]
  glitch:
    label: "游戏机制漏洞/特性"
    keywords: [update suppression, suppressor, CCE, OOM, block swap]
  coding:
    label: "命令方块、数据包编程"
    keywords: [command block, data pack, give, execute, tp, algorithm, data structure]
  worldgen:
    label: "世界生成、区块、噪声算法"
    keywords: [world generation, terrain generation, Perlin noise, octave, biome, chunk, RNG, seed, noise map, bilinear interpolation, cave, ore]
  "1.12.2_magic":
    label: "1.12.2 版本特有机制"
    keywords: [async observer, chunk manipulation, chunk swap, falling swap, instant falling, instant tile tick, word tear, crossworld, cluster]

# 始终加载的默认分类（已并入 glossary_load_plan.py 的常驻集，此处留空）
always_load: []

# 兜底组合（已废弃，留作参考）
fallback:
  - general
  - mechanical
